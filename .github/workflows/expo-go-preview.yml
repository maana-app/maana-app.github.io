name: Expo Go preview (tunnel)
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'How long to keep the dev server alive (hours, max 5)'
        default: '3'
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/expo-go-preview.yml']
concurrency:
  group: expo-go-preview
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
      - name: Open public tunnel (trycloudflare, no account)
        run: |
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://localhost:8081 > /tmp/cf.log 2>&1 &
          for i in $(seq 1 60); do
            PUB=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$PUB" ] && break; sleep 2
          done
          [ -z "$PUB" ] && { cat /tmp/cf.log; exit 1; }
          echo "PUB=$PUB" >> $GITHUB_ENV
      - name: Start Metro behind the tunnel
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          export EXPO_PACKAGER_PROXY_URL="$PUB"
          nohup npx expo start --go --port 8081 > /tmp/expo.log 2>&1 &
          for i in $(seq 1 90); do
            grep -q "Waiting on\|waiting on\|Metro waiting" /tmp/expo.log && break; sleep 3
          done
          tail -30 /tmp/expo.log
          URL="exps://${PUB#https://}"
          echo "EXPO_URL=$URL" >> $GITHUB_ENV
          echo "## Open in Expo Go" >> $GITHUB_STEP_SUMMARY
          echo "\`$URL\`" >> $GITHUB_STEP_SUMMARY
          echo "::notice title=Expo Go URL::$URL"
      - name: Warm up the bundle
        run: |
          curl -s -o /tmp/m.json -w 'manifest %{http_code}\n' -H 'expo-platform: ios' -H 'accept: application/expo+json,application/json' "$PUB" || true
          head -c 600 /tmp/m.json; echo
          B=$(grep -oE '"launchAsset":\{[^}]*"url":"[^"]+' /tmp/m.json | grep -oE 'https?://[^"]+$' | head -1)
          R="no-bundle-url"; [ -n "$B" ] && R=$(curl -s -o /dev/null -w '%{http_code} %{size_download}' --max-time 600 "$B")
          echo "::notice title=Warmup::manifest=$(head -c 120 /tmp/m.json | tr -d '\n"') bundle=$B result=$R"
      - name: Publish URL to branch expo-url
        working-directory: .
        run: |
          git config user.name ma3na-bot; git config user.email noreply@anthropic.com
          git checkout --orphan expo-url-tmp
          git rm -rfq . >/dev/null
          printf '%s\n%s\n%s\n' "$EXPO_URL" "$PUB" "$(date -u +%FT%TZ)" > URL.txt
          echo "$(grep -o 'result=.*' /dev/null)" >/dev/null
          git add URL.txt && git commit -qm "Expo Go URL" && git push -fq origin HEAD:expo-url
      - name: Keep alive
        run: |
          H=${{ github.event.inputs.hours || '3' }}
          [ "$H" -gt 5 ] && H=5
          echo "Serving $EXPO_URL for $H hours"
          sleep $((H*3600))
