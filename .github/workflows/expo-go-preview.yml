name: Expo Go preview (tunnel)
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'How long to keep the dev server alive (hours, max 5)'
        default: '3'
  push:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/expo-go-preview.yml', '.github/expo-restart']
concurrency:
  group: expo-go-preview
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
      - name: Open public tunnel (trycloudflare, no account)
        run: |
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://localhost:8081 > /tmp/cf.log 2>&1 &
          for i in $(seq 1 60); do
            PUB=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$PUB" ] && break; sleep 2
          done
          [ -z "$PUB" ] && { cat /tmp/cf.log; exit 1; }
          echo "PUB=$PUB" >> $GITHUB_ENV
      - name: Start Metro
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            # Signed-in mode: Expo's own tunnel, required by Expo Go for remote dev servers
            npm i -g @expo/ngrok@^4.1.0 >/dev/null 2>&1
            nohup npx expo start --go --tunnel --port 8081 > /tmp/expo.log 2>&1 &
            for i in $(seq 1 120); do
              H=$(grep -oE '[a-zA-Z0-9._-]+\.(exp\.direct|on\.expo\.app)' /tmp/expo.log | head -1)
              [ -n "$H" ] && break; sleep 3
            done
            URL="exp://$H"; PUB="https://$H"
          else
            export EXPO_PACKAGER_PROXY_URL="$PUB"
            nohup npx expo start --go --port 8081 > /tmp/expo.log 2>&1 &
            for i in $(seq 1 90); do grep -qi "waiting on" /tmp/expo.log && break; sleep 3; done
            URL="exps://${PUB#https://}"
          fi
          tail -30 /tmp/expo.log
          [ "$URL" = "exp://" ] || [ -z "$URL" ] && exit 1
          echo "PUB=$PUB" >> $GITHUB_ENV
          echo "EXPO_URL=$URL" >> $GITHUB_ENV
          echo "::notice title=Expo Go URL::$URL"
      - name: Warm up the bundle
        run: |
          curl -s -o /tmp/m.json -w 'manifest %{http_code}\n' -H 'expo-platform: ios' -H 'accept: application/expo+json,application/json' "$PUB" || true
          head -c 600 /tmp/m.json; echo
          B=$(grep -oE '"launchAsset":\{[^}]*"url":"[^"]+' /tmp/m.json | grep -oE 'https?://[^"]+$' | head -1)
          R="no-bundle-url"; [ -n "$B" ] && R=$(curl -s -o /dev/null -w '%{http_code} %{size_download}' --max-time 600 "$B")
          echo "::notice title=Warmup::manifest=$(head -c 120 /tmp/m.json | tr -d '\n"') bundle=$B result=$R"
      - name: Publish URL to branch expo-url
        working-directory: /tmp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n%s\n%s\n' "$EXPO_URL" "$PUB" "$(date -u +%FT%TZ)" > /tmp/URL.txt
          SHA=$(gh api "repos/${{ github.repository }}/contents/URL.txt?ref=expo-url" -q .sha 2>/dev/null || true)
          gh api -X PUT "repos/${{ github.repository }}/contents/URL.txt" -f message="Expo Go URL" -f branch=expo-url \
            -f content="$(base64 -w0 /tmp/URL.txt)" ${SHA:+-f sha=$SHA} >/dev/null
      - name: Keep alive
        run: |
          H=${{ github.event.inputs.hours || '3' }}
          [ "$H" -gt 5 ] && H=5
          echo "Serving $EXPO_URL for $H hours"
          sleep $((H*3600))
