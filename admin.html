  ${POS.filter(p=>p.sup===ME).map(o=>`<tr><td class="mono">${o.id}</td><td>${P(o.sku).name}</td><td class="num">${o.qty} كرتون</td><td class="num">${sar(o.unit)}</td><td class="num">${sar(o.qty*o.unit)}</td><td><span class="pill ${o.status==='مؤكد'?'s-open':'s-warn'}">${o.status}</span>${o.ready?`<div class="note">جاهز ${o.ready}</div>`:''}</td><td>${o.status==='بانتظار تأكيد المورد'?`<button type="button" class="btn sm pri" data-act="poOpen" data-id="${o.id}">مراجعة وتأكيد</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
};
function poDrawer(id){
  const o=POS.find(x=>x.id===id);
  openDrawer(`تأكيد ${o.id}`, `<dl class="kv"><dt>المنتج</dt><dd>${P(o.sku).name}</dd><dt>الحملة</dt><dd class="mono">${o.cmp}</dd><dt>الكمية المطلوبة</dt><dd class="num">${o.qty} كرتون</dd><dt>سعر الجملة</dt><dd class="num">${sar(o.unit)}</dd><dt>مستودع الاستلام</dt><dd>${S(ME).wh[0].name} · <span class="mono">${S(ME).wh[0].addr}</span></dd></dl>
  <div class="form"><div class="f"><label for="po-q">الكمية اللي تقدر توفرها</label><input id="po-q" type="number" value="${o.qty}" min="0" max="${o.qty}"></div><div class="f"><label for="po-d">تاريخ الجاهزية للاستلام</label><input id="po-d" type="date" value="2026-11-02"></div></div>
  <p class="note">إذا وفرت أقل من المطلوب، ma3na تخدم العملاء الأقدم انضماماً وتسترد للباقي تلقائياً.</p>
  <div class="tools"><button type="button" class="btn pri" data-act="poConfirm" data-id="${o.id}">تأكيد</button><button type="button" class="btn dan" data-act="poReject" data-id="${o.id}">اعتذار عن التوريد</button></div>`);
}
V['s-pickups'] = () => {
  head('مواعيد الاستلام','Supplier Portal');
  return `<div class="card"><div class="tw"><table><thead><tr><th>الموعد</th><th>أمر الشراء</th><th>المستودع</th><th>عدد الكراتين</th><th>شركة التوصيل</th><th>الحالة</th><th></th></tr></thead><tbody>
    <tr><td>25 أكتوبر · 1–3م</td><td class="mono">PO-5524</td><td>المصانع الثانية</td><td class="num">214</td><td>3PL · شاحنة واحدة</td><td><span class="pill s-open">تم الاستلام</span></td><td><button type="button" class="btn sm" data-act="packing">قائمة التعبئة</button></td></tr>
    ${POS.filter(p=>p.sup===ME&&p.status==='مؤكد'&&p.id!=='PO-5524').map(o=>`<tr><td>${o.ready} · 9–12ص</td><td class="mono">${o.id}</td><td>المصانع الثانية</td><td class="num">${o.qty}</td><td>3PL</td><td><span class="pill s-sched">مجدول</span></td><td><button type="button" class="btn sm" data-act="packing">قائمة التعبئة</button></td></tr>`).join('')}
  </tbody></table></div></div><p class="note">المورد يجهز الكراتين بالكمية فقط. الفرز ولصق البوليصة على كل طرد يتم في مركز توزيع شركة التوصيل.</p>`;
};
V['s-invoices'] = () => {
  head('الفواتير والمدفوعات','Supplier Portal');
  return `<div class="tools"><label class="btn" for="inv-up">رفع فاتورة ضريبية (PDF)</label><input id="inv-up" type="file" accept="application/pdf" hidden></div>
  <div class="card"><div class="tw"><table><thead><tr><th>الفاتورة</th><th>أمر الشراء</th><th>المبلغ</th><th>الاستحقاق</th><th>الحالة</th></tr></thead><tbody>
    <tr><td class="mono">INV-NQ-2210</td><td class="mono">PO-5517</td><td class="num">${sar(11238.5)}</td><td>عند التسليم</td><td><span class="pill s-open">مدفوعة · 20 أكتوبر</span></td></tr>
    <tr><td class="mono">INV-NQ-2231</td><td class="mono">PO-5524</td><td class="num">${sar(25038)}</td><td>بعد اكتمال التسليم</td><td><span class="pill s-sched">قيد المطابقة</span></td></tr>
  </tbody></table></div></div>`;
};
V['s-profile'] = () => {
  head('بيانات المنشأة','Supplier Portal');
  const s=S(ME);
  return `<div class="grid2"><div class="card"><h3>المنشأة</h3><div class="pad"><dl class="kv"><dt>الاسم</dt><dd>${s.name}</dd><dt>السجل التجاري</dt><dd class="mono">${s.cr}</dd><dt>الرقم الضريبي</dt><dd class="mono">${s.vat}</dd><dt>الآيبان</dt><dd class="mono">SA03 80XX XXXX XXXX XXXX XXXX</dd><dt>شروط الدفع</dt><dd>${s.terms}</dd></dl></div></div>
  <div class="card"><h3>مستودعات الاستلام</h3><div class="list">${s.wh.map(w=>`<div class="li"><div class="t"><b>${w.name}</b><span>${w.addr} · ${w.hours}</span></div></div>`).join('')}</div></div></div>`;
};

/* ---------- drawer & routing ---------- */
let lastFocus=null;
function openDrawer(t,html){ lastFocus=document.activeElement; $('#dtitle').textContent=t; $('#dbody').innerHTML=html; $('#drawer').hidden=false; $('#dclose').focus(); }
function closeDrawer(){ $('#drawer').hidden=true; if(lastFocus) lastFocus.focus(); }
$('#dclose').onclick=closeDrawer;
$('#drawer').addEventListener('click',e=>{ if(e.target.id==='drawer') closeDrawer(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#drawer').hidden) closeDrawer(); if(e.key==='Enter'&&e.target.matches('tr.click')) e.target.click(); });

function route(){ let k=(location.hash||'').slice(1); if(!V[k]) k= mode==='supp'?'s-dashboard':'dashboard'; mode=k.startsWith('s-')?'supp':'admin'; return k; }
function render(){
  const k=route(); buildNav();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===k));
  $('#view').innerHTML=V[k]();
  if(k==='campaigns'){ campRows(); $('#q').oninput=campRows; $('#fs').onchange=campRows; $('#newc').onclick=newCampaign; }
  if(k==='orders'){ orderRows(); $('#oq').oninput=orderRows; $('#oc').onchange=orderRows; }
  if(k==='finance') finBody();
  if(k==='s-invoices') $('#inv-up').onchange=()=>toast('تم رفع الفاتورة وإرسالها للمطابقة');
}
addEventListener('hashchange',render);

document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]'); if(tab){ finTab=tab.dataset.tab; document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b===tab)); finBody(); return; }
  const r=e.target.closest('tr.click'); if(r&&!e.target.closest('button')){ if(r.dataset.cmp) campaignDrawer(r.dataset.cmp); if(r.dataset.ord) orderDrawer(r.dataset.ord); if(r.dataset.sup) supplierDrawer(r.dataset.sup); return; }
  const b=e.target.closest('[data-act]'); if(!b) return; const id=b.dataset.id, a=b.dataset.act;
  const C=()=>CAMPAIGNS.find(x=>x.id===id);
  if(a==='close'){ const c=C(); c.status = c.joined>=c.min?'Succeeded':'Refunded'; if(c.status==='Succeeded'){ c.status='Confirmed'; ORDERS.filter(o=>o.cmp===id).forEach(o=>o.pay='Captured'); toast('نجحت الحملة: خُصمت المبالغ وأُرسل أمر الشراء للمورد'); } else { ORDERS.filter(o=>o.cmp===id).forEach(o=>o.pay='Voided'); toast('لم تصل للحد الأدنى: فُك حجز كل المبالغ'); } campaignDrawer(id); render(); return; }
  if(a==='cancel'){ C().status='Cancelled'; ORDERS.filter(o=>o.cmp===id).forEach(o=>o.pay='Voided'); closeDrawer(); toast('أُلغيت الحملة وفُك حجز المبالغ'); render(); return; }
  if(a==='openNow'){ C().status='Open'; campaignDrawer(id); toast('فُتحت الحملة وأُرسل تنبيه للمفضلين'); render(); return; }
  if(a==='ship'){ const c=C(); c.status='Shipping'; let i=0; ORDERS.filter(o=>o.cmp===id).forEach(o=>{ o.awb='ARX78'+(10500+i++); o.shipSt='CREATED'; }); toast(`أُرسلت ${i} شحنة لشركة التوصيل وصدرت البوالص`); campaignDrawer(id); render(); return; }
  if(a==='label'){ labelDrawer(id); return; }
  if(a==='resched'){ const o=ORDERS.find(x=>x.id===id); o.shipSt='OUT_FOR_DELIVERY'; toast('أُعيدت جدولة التوصيل وأُرسل رابط للعميل'); render(); return; }
  if(a==='cancelOrder'){ const o=ORDERS.find(x=>x.id===id); o.pay='Voided'; const c=CAMPAIGNS.find(x=>x.id===o.cmp); c.joined-=o.q; c.orders--; orderDrawer(id); toast('أُلغي الطلب وفُك الحجز'); render(); return; }
  if(a==='refundReq'){ const o=ORDERS.find(x=>x.id===id); REFUNDS.unshift({id:'RF-3'+(12+REFUNDS.length),order:o.id,reason:'طلب من خدمة العملاء',amount:o.amount,status:'بانتظار الموافقة',by:'خدمة العملاء'}); toast('أُرسل طلب الاسترداد للمالية'); render(); return; }
  if(a==='ticket'){ TICKETS.unshift({id:'TK-12'+(10+TICKETS.length),order:id,subj:'تذكرة جديدة من صفحة الطلب',prio:'عادية',st:'مفتوحة',age:'الآن'}); toast('فُتحت تذكرة'); render(); return; }
  if(a==='approvePay'){ PAYOUTS.find(x=>x.id===id).status='معتمد'; AUDIT.unshift(['الآن','صاحب الفكرة (Super Admin)',`اعتمد طلب الصرف ${id}`]); toast('اعتُمد طلب الصرف · جاهز للتحويل'); render(); return; }
  if(a==='rejectPay'){ PAYOUTS.find(x=>x.id===id).status='مرفوض'; toast('رُفض طلب الصرف'); render(); return; }
  if(a==='paid'){ PAYOUTS.find(x=>x.id===id).status='تم التحويل'; toast('سُجل التحويل وأُرفق الإيصال'); render(); return; }
  if(a==='mkPay'){ PAYOUTS.unshift({id:'PY-0'+(89+PAYOUTS.length-3),to:'شركة النقاء للمنظفات',ref:'PO-5524 · C-1039',amount:25038,maker:'أنت',status:'بانتظار الاعتماد'}); toast('أُنشئ طلب صرف · يحتاج اعتماد شخص ثاني'); render(); return; }
  if(a==='approveRef'){ REFUNDS.find(x=>x.id===id).status='تم'; toast('تمت الموافقة · أُرسل الاسترداد لبوابة الدفع وصدر إشعار دائن'); render(); return; }
  if(a==='rejectRef'){ REFUNDS.find(x=>x.id===id).status='مرفوض'; toast('رُفض الاسترداد'); render(); return; }
  if(a==='closeTk'){ TICKETS.find(x=>x.id===id).st='مغلقة'; toast('أُغلقت التذكرة'); render(); return; }
  if(a==='approveSupp'){ const s=S(id); s.status='نشط'; closeDrawer(); toast('اعتُمد المورد'); render(); return; }
  if(a==='newSupp'||a==='newProd'){ toast('في النسخة الفعلية: نموذج إدخال كامل'); return; }
  if(a==='submitPrice'){ toast('أُرسلت الأسعار لفريق ma3na للاعتماد'); return; }
  if(a==='poOpen'){ poDrawer(id); return; }
  if(a==='poConfirm'){ const o=POS.find(x=>x.id===id); const q=+$('#po-q').value; o.qty=q; o.status='مؤكد'; o.ready=new Date($('#po-d').value).toLocaleDateString('ar-SA-u-ca-gregory',{day:'numeric',month:'long'}); closeDrawer(); toast(q<150?`تأكيد جزئي ${q} كرتون · سيُسترد للباقي`:'تم التأكيد · سيُجدول الاستلام مع شركة التوصيل'); render(); return; }
  if(a==='poReject'){ POS.find(x=>x.id===id).status='اعتذر المورد'; closeDrawer(); toast('سُجل الاعتذار · فريق ma3na بيتواصل معك'); render(); return; }
  if(a==='packing'){ toast('قائمة التعبئة: عدد الكراتين ورقم أمر الشراء فقط'); return; }
});
render();
</script>

</body></html>
