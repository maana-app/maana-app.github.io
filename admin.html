<style>
/* Layout: an operations console — app switcher + sidebar, a dense working area of KPIs, tables and side drawers. */
:root{
  /* palette taken from the ma3na mark: deep green letters, cream ground, and the three "people" dots (coral · mango · sage) */
  --bg:#F5F1E8; --panel:#FFFDF9; --ink:#14302A; --mute:#68736E; --line:#E7E0D2; --soft:#FAF7F2; --hover:#F2ECE1;

  --amber:#C98A12; --blue:#0B725D; --plum:#0B3D33; --red:#C9432F;

  --fd:'Readex Pro','IBM Plex Sans Arabic',Tahoma,sans-serif; --fb:'IBM Plex Sans Arabic','Readex Pro',Tahoma,sans-serif; --fm:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0D1714;--panel:#13201C;--ink:#E8EFEB;--mute:#93A39B;--line:#25342F;--soft:#18261F;--hover:#1D2C26;--side:#091E19;--coralT:#3A1F1B;--goldT:#3A2F17;--sageT:#1B3027;--brandT:#1A2D27;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1714;--panel:#13201C;--ink:#E8EFEB;--mute:#93A39B;--line:#25342F;--soft:#18261F;--hover:#1D2C26;--side:#091E19;--coralT:#3A1F1B;--goldT:#3A2F17;--sageT:#1B3027;--brandT:#1A2D27;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
aside{background:var(--side);color:var(--sideink);display:flex;flex-direction:column;gap:6px;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:8px;font:700 22px var(--fd);color:#fff;padding:2px 8px 10px}

nav a .c{margin-inline-start:auto;background:var(--coral);color:#fff;border-radius:99px;font:600 11px var(--fm);padding:0 7px}

.me b{display:block;color:#fff;font-size:13.5px}
main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}

.crumb{color:var(--mute);font-size:12.5px}

.content{padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi span{color:var(--mute);font-size:12.5px}

.kpi.warn b{color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.card>h3{font:600 15px var(--fd);margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card>h3 .act{margin-inline-start:auto}
.pad{padding:14px}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{font:600 12px var(--fd);color:var(--mute);background:var(--soft)}
tbody tr{cursor:default} tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--hover)}
td.num,.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--fm);font-size:12.5px}

.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-open{background:#E3F2EC;color:#0B725D} .s-sched{background:#E7ECF8;color:#2D4FA3} .s-ship{background:#F3E6EE;color:#8E2C62}
.s-done{background:#ECEEED;color:#4D5955} .s-fail{background:#FBE5E1;color:#B33A27} .s-warn{background:#FFF1D6;color:#8A5A00}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden;min-width:90px} .bar i{display:block;height:100%;background:var(--green);border-radius:9px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 13px;cursor:pointer;font:600 13px var(--fd);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.co{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.dan{color:var(--red);border-color:#F0C7BF}

.btn:focus-visible,nav a:focus-visible,.sw button:focus-visible,tr.click:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 11px;min-width:0}
.tools .sp{margin-inline-start:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font:600 13px var(--fd);color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--coral)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{min-width:0;flex:1} .li .t b{display:block;font-weight:600} .li .t span{color:var(--mute);font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.drawer{position:fixed;inset:0;background:rgba(10,20,17,.35);display:flex;justify-content:flex-start;z-index:30}
.drawer[hidden]{display:none}
.dpanel{background:var(--panel);width:min(560px,100%);height:100%;overflow:auto;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.2)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dh h2{font:600 17px var(--fd);margin:0}
.dh .x{margin-inline-start:auto}
.dbody{padding:16px;display:flex;flex-direction:column;gap:14px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13.5px}

.tl{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}

.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12.5px;color:var(--mute)}
.f input,.f select{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 10px;min-width:0}
.calc{background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.calc div span{display:block;color:var(--mute);font-size:12px} .calc div b{font:600 17px var(--fd)}
.ok-t{color:var(--green)} .bad-t{color:var(--red)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;padding:10px 18px;border-radius:10px;font:600 13.5px var(--fd);opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.on{opacity:1}
.empty{color:var(--mute);padding:20px;text-align:center}
.note{font-size:12.5px;color:var(--mute)}
.perm td:not(:first-child){text-align:center}
.label{border:2px dashed var(--ink);border-radius:8px;padding:12px;font-family:var(--fm);font-size:12px;display:grid;gap:4px;background:#fff;color:#111}
.label .bc{height:44px;background:repeating-linear-gradient(90deg,#111 0 2px,#fff 2px 4px,#111 4px 5px,#fff 5px 8px,#111 8px 11px,#fff 11px 12px)}
@media (max-width: 860px){
  .app{grid-template-columns:1fr}

  .grid2{grid-template-columns:1fr}

}

/* ---------- economics ---------- */
function econ(b,n){
  const p=P(b.sku), pr=tierAt(b.tiers,n)[1], cost=costAt(p,n), orders=Math.max(1,Math.round(n/Math.max(1,b.avgQ)));
  const goods=pr*n, dCol=orders*b.fee1+Math.max(0,n-orders)*b.feeX, dCost=b.ship*n, payFee=(goods+dCol)*CFG.payPct/100, sup=cost*n;
  const contrib=goods-sup-payFee+dCol-dCost;
  return {n,pr,cost,orders,goods,dCol,dCost,payFee,sup,contrib,gmv:goods+dCol,pct:goods?contrib/goods*100:0};
}
function tierRow(b,i){ const p=P(b.sku), [t,pr]=b.tiers[i], cost=costAt(p,t), fee=pr*CFG.payPct/100, m=pr-cost-fee;
  return {t,pr,cost,m,mp:pr?m/pr*100:0,save:(1-pr/b.mkt)*100, one:pr+b.fee1, two:(2*pr+b.fee1+b.feeX)/2}; }

function bChecks(b){
  const p=P(b.sku), s=S(p.sup), E=[], W=[], OK=[];
  (s.status==='نشط'?OK:E).push(s.status==='نشط'?`المورد ${s.name} معتمد`:`المورد ${s.name} غير معتمد بعد (${s.status})`);
  (p.kg&&p.dim?OK:E).push(p.kg&&p.dim?'وزن وأبعاد الكرتون موجودة للبوليصة':'وزن أو أبعاد الكرتون ناقصة، شركة التوصيل ما تقدر تصدر بوليصة');
  if(!b.title.trim()) E.push('اسم الحملة فاضي');
  let asc=true; b.tiers.forEach((t,i)=>{ if(i&&(t[0]<=b.tiers[i-1][0]||t[1]>=b.tiers[i-1][1])) asc=false; });
  (asc?OK:E).push(asc?'الشرائح مرتبة: الكمية تزيد والسعر ينزل':'الشرائح غير مرتبة: كل شريحة لازم كميتها أكبر وسعرها أقل من اللي قبلها');
  if(b.tiers[0][0]!==b.min) E.push(`الشريحة الأولى لازم تبدأ من الحد الأدنى (${b.min} كرتون)`);
  if(b.cap < b.tiers[b.tiers.length-1][0]) E.push('سقف الكمية أقل من آخر شريحة');
  if(b.cap > p.avail) W.push(`السقف (${fmt(b.cap)}) أكبر من الكمية المتوفرة عند المورد (${fmt(p.avail)})`);
  const low = b.tiers.map((_,i)=>tierRow(b,i)).filter(r=>r.mp<CFG.minMargin);
  if(low.length) E.push(`هامش ${low.map(r=>r.t+'+').join('، ')} أقل من الحد المعتمد ${CFG.minMargin}%`); else OK.push(`كل الشرائح فوق هامش ${CFG.minMargin}%`);
  const r0=tierRow(b,0);
  if(r0.save < CFG.minSave) W.push(`التوفير في الشريحة الأولى ${r0.save.toFixed(0)}% فقط، أقل من ${CFG.minSave}% (افتراض ننتظر تأكيده من نتائج الاستبيان)`);
  if(r0.one >= b.mkt) W.push(`اللي يطلب كرتون واحد يدفع ${sar(r2(r0.one))} مع التوصيل، أغلى من السوق (${sar(b.mkt)})`);
  const d=days(b.open,b.close);
  if(b.start==='schedule' && !(d>0)) E.push('موعد الإغلاق لازم يكون بعد موعد الفتح');
  else if(d>CFG.holdDays) W.push(`مدة الحملة ${d.toFixed(1)} يوم، أطول من مدة حجز المبلغ (${CFG.holdDays} أيام، افتراض ننتظر تأكيده من بوابة الدفع D-01)`);
  else OK.push(`مدة الحملة ${b.start==='now'?days(new Date(),b.close).toFixed(1):d.toFixed(1)} يوم ضمن مدة الحجز`);
  if(!b.cities.length) E.push('اختر مدينة واحدة على الأقل');
  if(!b.methods.length) E.push('اختر طريقة دفع واحدة على الأقل');
  if(b.ship>b.feeX) W.push(`كل كرتون إضافي يكلف ${sar(b.ship)} ونأخذ عليه ${sar(b.feeX)} بس. الفرق يطلع من الهامش`);
  const onlyMargin = E.length===1 && low.length;
  return {E,W,OK,onlyMargin};
}

function bLiveTiers(){ B.tiers.forEach((_,i)=>{ const r=tierRow(B,i), q=k=>$(`[data-cell="${k}${i}"]`); if(!q('m')) return;
  q('cost').textContent=sar(r.cost); q('m').textContent=`${sar(r2(r.m))} · ${r.mp.toFixed(1)}%`; q('m').className=`num ${r.mp>=CFG.minMargin?'ok-t':'bad-t'}`; q('s').textContent=r.save.toFixed(0)+'%'; q('o').textContent=sar(r2(r.one)); q('o').className=`num ${r.one>=B.mkt?'bad-t':''}`; }); }
function bBind(){
  const f=$('#bform');
  f.oninput = f.onchange = ev => { const t=ev.target;
    if(t.dataset.img){ const file=t.files[0]; if(!file) return; const rd=new FileReader(); rd.onload=()=>{ B.img=rd.result; bRender(); }; rd.readAsDataURL(file); return; }
    if(t.dataset.tier){ const [i,j]=t.dataset.tier.split(',').map(Number); B.tiers[i][j]=+t.value||0; if(i===0&&j===0) B.min=B.tiers[0][0]; bLiveTiers(); bSteps(); bPrev(); return; }
    if(t.dataset.arr){ const a=B[t.dataset.arr]; if(t.checked&&!a.includes(t.value)) a.push(t.value); if(!t.checked) a.splice(a.indexOf(t.value),1); bSteps(); bPrev(); return; }
    if(t.dataset.bc){ const [a,b]=t.dataset.bc.split('.'); if(b) B[a][b]=t.checked; else B[a]=t.checked; bSteps(); return; }
    const k=t.dataset.b; if(!k) return; if(t.type==='radio'&&!t.checked) return;
    let v=t.value; if(t.type==='number'||t.type==='range') v=+v||0;
    if(k==='sku'){ if(ev.type!=='change') return; const keep={step:B.step,editId:B.editId}; B={...bDefault(v),...keep}; bRender(); return; }
    B[k]=v;
    if(k==='min'){ B.tiers[0][0]=v; }
    if(t.dataset.live==='econ'){ $('#expv').textContent=fmt(v); $('#econbox').innerHTML=econBox(econ(B,v)); bPrev(); return; }
    if((t.dataset.rr||t.type==='radio') && ev.type==='change'){ bRender(); return; }
    if(t.dataset.rr==='tiers'){ bSteps(); bPrev(); return; }
    bSteps(); bPrev(); if(B.step===2) bLiveTiers();
  };
  $('#bnext-btn').onclick=()=>{ B.step=Math.min(BSTEPS.length-1,B.step+1); bRender(); scrollTo({top:0}); };
  $('#bprev-btn').onclick=()=>{ B.step=Math.max(0,B.step-1); bRender(); scrollTo({top:0}); };
}

  AUDIT.unshift(['الآن',`${ME_ADMIN.name} (${ME_ADMIN.role})`,`${what} الحملة ${id} · ${B.title}`]);

}

/* ---------- drawer & routing ---------- */
let lastFocus=null;
function openDrawer(t,html){ lastFocus=document.activeElement; $('#dtitle').textContent=t; $('#dbody').innerHTML=html; $('#drawer').hidden=false; $('#dclose').focus(); }
function closeDrawer(){ $('#drawer').hidden=true; if(lastFocus) lastFocus.focus(); }
$('#dclose').onclick=closeDrawer;
$('#drawer').addEventListener('click',e=>{ if(e.target.id==='drawer') closeDrawer(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('#drawer').hidden) closeDrawer(); if(e.key==='Enter'&&e.target.matches('tr.click')) e.target.click(); });

function route(){ let k=(location.hash||'').slice(1); if(!V[k]) k= mode==='supp'?'s-dashboard':'dashboard'; mode=k.startsWith('s-')?'supp':'admin'; return k; }
function render(){
  const k=route(); buildNav();
  if(mode==='admin'&&!can(k)){ location.hash='dashboard'; return; }
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.k===(k==='builder'?'campaigns':k)));
  $('#view').innerHTML=V[k]();
  if(k==='campaigns'){ campRows(); $('#q').oninput=campRows; $('#fs').onchange=campRows; if($('#newc')) $('#newc').onclick=newCampaign; }
  if(k==='orders'){ orderRows(); $('#oq').oninput=orderRows; $('#oc').onchange=orderRows; }
  if(k==='finance') finBody();
  if(k==='builder'){ bRender(); bBind(); }
  if(k==='s-invoices') $('#inv-up').onchange=()=>toast('تم رفع الفاتورة وإرسالها للمطابقة');
}
addEventListener('hashchange',()=>{ if(!$('#drawer').hidden){ $('#drawer').hidden=true; } render(); });

document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]'); if(tab){ finTab=tab.dataset.tab; document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b===tab)); finBody(); return; }
  const r=e.target.closest('tr.click'); if(r&&!e.target.closest('button')){ if(r.dataset.cmp) campaignDrawer(r.dataset.cmp); if(r.dataset.ord) orderDrawer(r.dataset.ord); if(r.dataset.sup) supplierDrawer(r.dataset.sup); if(r.dataset.tk) ticketDrawer(r.dataset.tk); return; }
  const st=e.target.closest('[data-step]'); if(st&&B&&$('#bform')){ B.step=+st.dataset.step; bRender(); scrollTo({top:0}); return; }
  const b=e.target.closest('[data-act]'); if(!b) return; const id=b.dataset.id, a=b.dataset.act;
  if(PERM[a] && !PERM[a].includes(ME_ADMIN.role)){ toast(`ما عندك صلاحية لهذا الإجراء (${ME_ADMIN.role})`); return; }
  if(a==='tierAdd'){ const l=B.tiers[B.tiers.length-1]; B.tiers.push([l[0]+Math.max(50,Math.round(B.min/2)), Math.max(0,l[1]-2)]); if(B.cap<B.tiers[B.tiers.length-1][0]) B.cap=B.tiers[B.tiers.length-1][0]; bRender(); return; }
  if(a==='tierDel'){ B.tiers.splice(+id,1); B.tiers[0][0]=B.min; bRender(); return; }
  if(a==='tierAuto'){ const p=P(B.sku); B.tiers=B.tiers.map((t,i)=>{ const pr = id==='save' ? B.mkt*(1-[0.24,0.27,0.30,0.32,0.34][Math.min(i,4)]) : costAt(p,t[0])/(1-0.12-CFG.payPct/100); return [t[0], Math.ceil(pr*2)/2]; }); bRender(); return; }
  if(a==='dur'){ const o=B.start==='now'?new Date():new Date(B.open); o.setDate(o.getDate()+(+id)); const z=n=>String(n).padStart(2,'0'); B.close=`${o.getFullYear()}-${z(o.getMonth()+1)}-${z(o.getDate())}T22:00`; bRender(); return; }
  if(a==='bImgClear'){ B.img=null; bRender(); return; }
  if(a==='bDraft'){ bSave('Draft'); return; }
  if(a==='bReview'){ bSave('Review'); return; }
  if(a==='bPublish'){ bSave(B.start==='now'?'Open':'Scheduled'); return; }
  if(a==='bDiscard'){ B=null; location.hash='campaigns'; toast('أُلغيت التعديلات'); return; }
  if(a==='editCamp'||a==='copyCamp'){ B=bFromCampaign(CAMPAIGNS.find(x=>x.id===id), a==='copyCamp'); if(a==='copyCamp') B.title=B.title+' (نسخة)'; closeDrawer(); location.hash='builder'; render(); return; }
  if(a==='approveRev'){ const c=CAMPAIGNS.find(x=>x.id===id); c.status='Scheduled'; AUDIT.unshift(['الآن',`${ME_ADMIN.name} (${ME_ADMIN.role})`,`اعتمد استثناء الهامش للحملة ${id}`]); campaignDrawer(id); toast('اعتُمد الاستثناء وجُدولت الحملة'); render(); return; }
  if(a==='rejectRev'){ CAMPAIGNS.find(x=>x.id===id).status='Draft'; campaignDrawer(id); toast('رجعت مسودة لصاحبها'); render(); return; }
  if(a==='extend'){ const c=CAMPAIGNS.find(x=>x.id===id); c.closes=c.closes+' + 24 ساعة'; AUDIT.unshift(['الآن',`${ME_ADMIN.name} (${ME_ADMIN.role})`,`مدّد الحملة ${id} 24 ساعة`]); campaignDrawer(id); toast('مُددت الحملة وأُشعر المنضمون'); render(); return; }
  if(a==='setCap'){ const c=CAMPAIGNS.find(x=>x.id===id), v=+$('#cap-in').value; if(v<c.joined){ toast('السقف ما ينفع يكون أقل من المحجوز'); return; } AUDIT.unshift(['الآن',`${ME_ADMIN.name} (${ME_ADMIN.role})`,`عدّل سقف ${id} من ${c.cap} إلى ${v}`]); c.cap=v; campaignDrawer(id); toast('حُفظ السقف'); render(); return; }
  if(a==='saveProd'){ saveProduct(); return; }
  if(a==='saveSupp'){ saveSupplier(); return; }
  if(a==='addUser'){ userForm(); return; }
  if(a==='saveUser'){ const n=$('#nu-n').value.trim(), em=$('#nu-e').value.trim(); if(!n||!em){ toast('الاسم والبريد مطلوبة'); return; } USERS.push({n,e:em,r:$('#nu-r').value,st:'دعوة مرسلة'}); AUDIT.unshift(['الآن',`${ME_ADMIN.name} (${ME_ADMIN.role})`,`دعا ${n} بدور ${$('#nu-r').value}`]); closeDrawer(); toast('أُرسلت الدعوة'); render(); return; }
  if(a==='saveCfg'){ Object.keys(CFG).forEach(k=>{ const el=$('#cfg-'+k); if(el) CFG[k]=+el.value; }); AUDIT.unshift(['الآن',`${ME_ADMIN.name} (${ME_ADMIN.role})`,'عدّل إعدادات المنصة']); toast('حُفظت الإعدادات · تطبق على الحملات الجديدة'); render(); return; }
  if(a==='tkReply'){ const t=TICKETS.find(x=>x.id===id), v=$('#tk-r').value.trim(); if(!v) return; t.msgs.push({who:'ma3na',txt:v,at:'الآن'}); t.st='بانتظار العميل'; ticketDrawer(id); toast('أُرسل الرد للعميل'); render(); return; }
  if(a==='tkOrder'){ orderDrawer(id); return; }
  const C=()=>CAMPAIGNS.find(x=>x.id===id);
  if(a==='close'){ const c=C(); c.status = c.joined>=c.min?'Succeeded':'Refunded'; if(c.status==='Succeeded'){ c.status='Confirmed'; ORDERS.filter(o=>o.cmp===id).forEach(o=>o.pay='Captured'); toast('نجحت الحملة: خُصمت المبالغ وأُرسل أمر الشراء للمورد'); } else { ORDERS.filter(o=>o.cmp===id).forEach(o=>o.pay='Voided'); toast('لم تصل للحد الأدنى: فُك حجز كل المبالغ'); } campaignDrawer(id); render(); return; }
  if(a==='cancel'){ C().status='Cancelled'; ORDERS.filter(o=>o.cmp===id).forEach(o=>o.pay='Voided'); closeDrawer(); toast('أُلغيت الحملة وفُك حجز المبالغ'); render(); return; }
  if(a==='openNow'){ C().status='Open'; campaignDrawer(id); toast('فُتحت الحملة وأُرسل تنبيه للمفضلين'); render(); return; }
  if(a==='ship'){ const c=C(); c.status='Shipping'; let i=0; ORDERS.filter(o=>o.cmp===id).forEach(o=>{ o.awb='ARX78'+(10500+i++); o.shipSt='CREATED'; }); toast(`أُرسلت ${i} شحنة لشركة التوصيل وصدرت البوالص`); campaignDrawer(id); render(); return; }
  if(a==='label'){ labelDrawer(id); return; }
  if(a==='resched'){ const o=ORDERS.find(x=>x.id===id); o.shipSt='OUT_FOR_DELIVERY'; toast('أُعيدت جدولة التوصيل وأُرسل رابط للعميل'); render(); return; }
  if(a==='cancelOrder'){ const o=ORDERS.find(x=>x.id===id); o.pay='Voided'; const c=CAMPAIGNS.find(x=>x.id===o.cmp); c.joined-=o.q; c.orders--; orderDrawer(id); toast('أُلغي الطلب وفُك الحجز'); render(); return; }
  if(a==='refundReq'){ const o=ORDERS.find(x=>x.id===id); REFUNDS.unshift({id:'RF-3'+(12+REFUNDS.length),order:o.id,reason:'طلب من خدمة العملاء',amount:o.amount,status:'بانتظار الموافقة',by:'خدمة العملاء'}); toast('أُرسل طلب الاسترداد للمالية'); render(); return; }
  if(a==='ticket'){ TICKETS.unshift({id:'TK-12'+(10+TICKETS.length),order:id,subj:'تذكرة جديدة من صفحة الطلب',prio:'عادية',st:'مفتوحة',age:'الآن'}); toast('فُتحت تذكرة'); render(); return; }
  if(a==='approvePay'){ PAYOUTS.find(x=>x.id===id).status='معتمد'; AUDIT.unshift(['الآن','صاحب الفكرة (Super Admin)',`اعتمد طلب الصرف ${id}`]); toast('اعتُمد طلب الصرف · جاهز للتحويل'); render(); return; }
  if(a==='rejectPay'){ PAYOUTS.find(x=>x.id===id).status='مرفوض'; toast('رُفض طلب الصرف'); render(); return; }
  if(a==='paid'){ PAYOUTS.find(x=>x.id===id).status='تم التحويل'; toast('سُجل التحويل وأُرفق الإيصال'); render(); return; }
  if(a==='mkPay'){ PAYOUTS.unshift({id:'PY-0'+(89+PAYOUTS.length-3),to:'شركة النقاء للمنظفات',ref:'PO-5524 · C-1039',amount:25038,maker:'أنت',status:'بانتظار الاعتماد'}); toast('أُنشئ طلب صرف · يحتاج اعتماد شخص ثاني'); render(); return; }
  if(a==='approveRef'){ REFUNDS.find(x=>x.id===id).status='تم'; toast('تمت الموافقة · أُرسل الاسترداد لبوابة الدفع وصدر إشعار دائن'); render(); return; }
  if(a==='rejectRef'){ REFUNDS.find(x=>x.id===id).status='مرفوض'; toast('رُفض الاسترداد'); render(); return; }
  if(a==='closeTk'){ TICKETS.find(x=>x.id===id).st='مغلقة'; if(!$('#drawer').hidden) closeDrawer(); toast('أُغلقت التذكرة'); render(); return; }
  if(a==='approveSupp'){ const s=S(id); s.status='نشط'; closeDrawer(); toast('اعتُمد المورد'); render(); return; }
  if(a==='newSupp'){ supplierForm(); return; }
  if(a==='newProd'){ prodFrom=b.dataset.from||null; productForm(); return; }
  if(a==='submitPrice'){ toast('أُرسلت الأسعار لفريق ma3na للاعتماد'); return; }
  if(a==='poOpen'){ poDrawer(id); return; }
  if(a==='poConfirm'){ const o=POS.find(x=>x.id===id); const q=+$('#po-q').value; o.qty=q; o.status='مؤكد'; o.ready=new Date($('#po-d').value).toLocaleDateString('ar-SA-u-ca-gregory',{day:'numeric',month:'long'}); closeDrawer(); toast(q<150?`تأكيد جزئي ${q} كرتون · سيُسترد للباقي`:'تم التأكيد · سيُجدول الاستلام مع شركة التوصيل'); render(); return; }
  if(a==='poReject'){ POS.find(x=>x.id===id).status='اعتذر المورد'; closeDrawer(); toast('سُجل الاعتذار · فريق ma3na بيتواصل معك'); render(); return; }
  if(a==='packing'){ toast('قائمة التعبئة: عدد الكراتين ورقم أمر الشراء فقط'); return; }
});
render();
</script>
