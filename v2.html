<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<title>معنا · تجربة التطبيق</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0B3D33;--g2:#0B725D;--co:#F06757;--co2:#FDECE8;--ink:#14201C;--mu:#6B7570;--ln:#ECEEEC;--bg:#FFFFFF;--sf:#F5F6F5;--gold:#F2B33D;--ok:#0B8A5F}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#E9ECEA;color-scheme:light}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;gap:48px}
.side{max-width:300px}
.side h1{font-size:22px;color:var(--g);margin:12px 0 6px}
.side p{color:var(--mu);line-height:1.7;font-size:13px}
.side .sim{display:inline-block;margin-top:12px;background:#FFF4D9;color:#7A5200;font-size:12px;font-weight:600;padding:5px 10px;border-radius:8px}
.phone{width:390px;height:844px;background:#000;border-radius:54px;padding:11px;box-shadow:0 30px 80px rgba(0,0,0,.25);flex:none}
.app{position:relative;width:100%;height:100%;background:var(--bg);border-radius:44px;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:560px){.stage{padding:0;display:block}.side{display:none}.phone{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none}.app{border-radius:0}}
.sbar{height:47px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 7px;font-weight:600;font-size:15px;direction:ltr}
.sbar i{display:inline-block;width:17px;height:11px;border-radius:2px;background:currentColor;margin-left:5px;opacity:.9}
.sbar b{display:inline-block;width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;margin-left:5px;position:relative}
.sbar b::after{content:'';position:absolute;inset:1.5px;right:5px;background:currentColor;border-radius:1.5px}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
/* tab bar */
.tabs{flex:none;display:flex;border-top:1px solid var(--ln);background:#fff;padding:6px 6px 22px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#8A928E;font-weight:500}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--g)}
.tab .dot{position:relative}
.tab .dot em{position:absolute;top:-3px;left:-7px;background:var(--co);color:#fff;font-style:normal;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* header */
.hdr{position:sticky;top:0;z-index:5;background:#fff;padding:6px 16px 10px}
.hrow{display:flex;align-items:center;gap:10px}
.hrow .logo{height:30px}
.addr{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.addr small{font-size:11px;color:var(--mu)}
.addr b{font-size:13px;display:flex;align-items:center;gap:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:38px;height:38px;border-radius:12px;background:var(--sf);display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.ib svg{width:21px;height:21px}
.ib .bd{position:absolute;top:7px;left:8px;width:8px;height:8px;border-radius:50%;background:var(--co);border:1.5px solid #fff}
.search{margin-top:10px;height:44px;border-radius:12px;background:var(--sf);display:flex;align-items:center;gap:8px;padding:0 13px;color:#8A928E;font-size:13.5px}
.search svg{width:19px;height:19px;flex:none}
/* home blocks */
.sec{padding:18px 16px 0}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sh h3{font-size:16px;font-weight:700}
.sh a{font-size:12.5px;color:var(--g2);font-weight:600;cursor:pointer}
.sh .tmr{font-size:12px;color:var(--co);font-weight:600}
.banners{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 0;scrollbar-width:none}
.banners::-webkit-scrollbar{display:none}
.bn{flex:0 0 calc(100% - 34px);scroll-snap-align:center;height:150px;border-radius:16px;position:relative;overflow:hidden;padding:16px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.bn h4{font-size:17px;line-height:1.35;max-width:58%}
.bn p{font-size:12px;opacity:.85;margin-top:3px;max-width:58%}
.bn .cta{align-self:flex-start;font-size:12px;font-weight:700;padding:6px 12px;border-radius:9px}
.bn .pk{position:absolute;left:8px;bottom:-6px;display:flex;align-items:flex-end}
.bn .pk img{height:118px;width:auto;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.18))}
.bn .pk img+img{height:96px;margin-right:-30px}
.dots{display:flex;justify-content:center;gap:5px;margin-top:9px}
.dots i{width:6px;height:6px;border-radius:3px;background:#D9DDDB}
.dots i.on{width:16px;background:var(--g)}
.cats{display:flex;gap:14px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:500;cursor:pointer}
.cat span{width:64px;height:64px;border-radius:50%;background:var(--sf);display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid transparent}
.cat span img{width:46px;height:46px;object-fit:contain}
.cat.on span{border-color:var(--g)}
.cat.on{color:var(--g);font-weight:700}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 16px 2px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.pc{position:relative;background:#fff;cursor:pointer}
.row .pc{flex:0 0 138px}
.pci{position:relative;height:138px;border-radius:14px;background:var(--sf);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pci img{max-width:84%;max-height:84%;object-fit:contain;mix-blend-mode:multiply}
.off{position:absolute;top:8px;right:8px;background:var(--co);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px}
.add{position:absolute;bottom:8px;left:8px;width:32px;height:32px;border-radius:10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;color:var(--g)}
.add svg{width:18px;height:18px}
.pn{font-size:13px;font-weight:500;margin-top:8px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:35px}
.pp{display:flex;align-items:baseline;gap:6px;margin-top:3px}
.pp b{font-size:16px;font-weight:700}
.pp small{font-size:11px;font-weight:600}
.pp s{font-size:12px;color:#9AA29E}
.gp{margin-top:6px}
.gbar{height:4px;border-radius:2px;background:#ECEEEC;overflow:hidden}
.gbar i{display:block;height:100%;background:var(--co);border-radius:2px}
.gt{font-size:11px;color:var(--mu);margin-top:4px;display:flex;justify-content:space-between}
.gt b{color:var(--co);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:0 16px}
.grid .pci{height:156px}
.again{display:flex;align-items:center;gap:12px;border:1px solid var(--ln);border-radius:14px;padding:10px;margin:0 16px;cursor:pointer}
.again .im{width:56px;height:56px;border-radius:10px;background:var(--sf);display:flex;align-items:center;justify-content:center;flex:none}
.again .im img{max-width:85%;max-height:85%;mix-blend-mode:multiply}
.again .tx{flex:1;min-width:0}
.again .tx b{font-size:13.5px;display:block}
.again .tx small{font-size:12px;color:var(--mu)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:14px;font-weight:700;font-size:15px;width:100%}
.btn.pri{background:var(--co);color:#fff}
.btn.dark{background:var(--g);color:#fff}
.btn.ghost{background:var(--sf);color:var(--ink)}
.btn.sm{height:36px;font-size:13px;border-radius:10px;width:auto;padding:0 14px}
.btn:disabled{opacity:.45}
.strip{margin:16px 16px 0;border-radius:14px;background:#F0F7F3;padding:12px;display:flex;gap:10px;align-items:center;font-size:12.5px;color:#26443A}
.strip svg{width:22px;height:22px;flex:none;color:var(--g2)}
.pad{height:24px}
/* top bar for inner pages */
.tbar{position:sticky;top:0;z-index:5;background:#fff;display:flex;align-items:center;gap:8px;padding:6px 12px 8px;min-height:52px}
.tbar h2{flex:1;font-size:16px;font-weight:700;text-align:center}
.tbar .ib{background:transparent}
/* product page */
.gal{background:var(--sf);height:330px;display:flex;align-items:center;justify-content:center;position:relative}
.gal img{max-height:260px;max-width:78%;mix-blend-mode:multiply}
.gal .gdots{position:absolute;bottom:12px;display:flex;gap:5px}
.gal .gdots i{width:6px;height:6px;border-radius:3px;background:#C9CFCC}
.gal .gdots i.on{background:var(--g);width:16px}
.gal .tl{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:5px;background:#fff;border-radius:9px;padding:5px 9px;font-size:12px;font-weight:600;color:var(--co);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.gal .tl svg{width:15px;height:15px}
.pd{padding:14px 16px 0}
.brand{font-size:12px;color:var(--g2);font-weight:600}
.pd h1{font-size:18px;font-weight:700;line-height:1.4;margin-top:2px}
.pd .meta{font-size:12.5px;color:var(--mu);margin-top:3px}
.prc{display:flex;align-items:baseline;gap:8px;margin-top:10px}
.prc b{font-size:26px;font-weight:700;color:var(--co)}
.prc small{font-size:13px;font-weight:700;color:var(--co)}
.prc s{color:#9AA29E;font-size:14px}
.prc em{font-style:normal;font-size:12px;font-weight:700;color:var(--co);background:var(--co2);padding:2px 7px;border-radius:6px}
.unit{font-size:12.5px;color:var(--mu);margin-top:3px}
.unit b{color:var(--ok)}
.card{border:1px solid var(--ln);border-radius:16px;padding:14px;margin:14px 16px 0}
.card h4{font-size:14.5px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.card h4 small{font-size:12px;color:var(--co);font-weight:600}
.big{height:8px;border-radius:4px;background:#ECEEEC;overflow:hidden;margin-top:12px;position:relative}
.big i{display:block;height:100%;background:linear-gradient(90deg,#F06757,#F4896F);border-radius:4px}
.bt{display:flex;justify-content:space-between;font-size:12.5px;margin-top:7px;color:var(--mu)}
.bt b{color:var(--ink)}
.tiers{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tier{border:1px solid var(--ln);border-radius:12px;padding:9px 8px;text-align:center}
.tier b{display:block;font-size:17px}
.tier small{font-size:11px;color:var(--mu)}
.tier.cur{border-color:var(--g);background:#F0F7F3}
.tier.cur b{color:var(--g)}
.tier.nx{border-style:dashed;border-color:var(--co)}
.avs{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--mu)}
.avs .st{display:flex}
.avs .st i{width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin-left:-8px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;color:#fff;font-weight:700}
.feed{margin-top:10px;font-size:12px;color:#4B5651;display:flex;align-items:center;gap:7px;height:20px;overflow:hidden}
.feed .ld{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 3px rgba(11,138,95,.15)}
.feed span{transition:opacity .3s}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln);font-size:13px}
.li:first-of-type{border-top:0}
.li svg{width:22px;height:22px;flex:none;color:var(--g2)}
.li .tx{flex:1}
.li .tx b{display:block;font-size:13.5px}
.li .tx small{color:var(--mu);font-size:12px}
.share{display:flex;align-items:center;gap:12px;background:#F0F7F3;border-radius:16px;padding:12px 14px;margin:14px 16px 0;cursor:pointer}
.share .wa{width:38px;height:38px;border-radius:12px;background:#25D366;display:flex;align-items:center;justify-content:center;flex:none}
.share .tx{flex:1;font-size:12.5px;color:#36524A}
.share .tx b{display:block;font-size:13.5px;color:var(--ink)}
.dock{flex:none;display:flex;gap:10px;align-items:center;padding:10px 16px 26px;border-top:1px solid var(--ln);background:#fff}
.qty{display:flex;align-items:center;border:1px solid var(--ln);border-radius:14px;height:50px}
.qty button{width:40px;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--g)}
.qty b{min-width:22px;text-align:center;font-size:16px}
/* checkout */
.sumr{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0}
.sumr.t{font-weight:700;font-size:15px;border-top:1px dashed var(--ln);margin-top:6px;padding-top:11px}
.sumr.s{color:var(--ok);font-size:12.5px}
.pm{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--ln);border-radius:14px;margin-top:8px;cursor:pointer}
.pm.on{border-color:var(--g);background:#F6FAF8}
.pm .lg{width:54px;font-size:9.5px!important;white-space:nowrap;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none}
.pm .tx{flex:1;font-size:13.5px;font-weight:600}
.pm .tx small{display:block;font-weight:400;font-size:11.5px;color:var(--mu)}
.pm .rd{width:20px;height:20px;border-radius:50%;border:2px solid #C9CFCC;flex:none}
.pm.on .rd{border:6px solid var(--g)}
.note{font-size:12px;color:var(--mu);line-height:1.6;margin:10px 16px 0;display:flex;gap:7px}
.note svg{width:16px;height:16px;flex:none;color:var(--g2);margin-top:2px}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;animation:fd .2s}
.sheet{width:100%;background:#fff;border-radius:22px 22px 0 0;padding:10px 18px 30px;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet .gr{width:38px;height:5px;border-radius:3px;background:#DADFDC;margin:0 auto 12px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fd{from{opacity:0}}
.ap{background:#F4F4F6}
.ap .aph{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:17px;margin-bottom:12px;direction:ltr}
.ap .row2{background:#fff;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.ap .tot{display:flex;justify-content:space-between;font-weight:700;font-size:16px;padding:6px 4px 14px}
.ap .side{display:flex;flex-direction:column;align-items:center;gap:6px;color:#2563EB;font-size:13px;margin-top:6px}
.toast{position:absolute;left:16px;right:16px;bottom:100px;background:#1F2A26;color:#fff;font-size:13px;border-radius:12px;padding:12px 14px;z-index:30;animation:fd .2s}
/* orders */
.seg{display:flex;background:var(--sf);border-radius:12px;padding:4px;margin:4px 16px 0}
.seg button{flex:1;height:34px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mu)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.oc{border:1px solid var(--ln);border-radius:16px;margin:12px 16px 0;padding:14px;cursor:pointer}
.oc .top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mu)}
.stt{font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px}
.oc .mid{display:flex;gap:12px;align-items:center;margin-top:10px}
.oc .mid .im{width:58px;height:58px;border-radius:10px;background:var(--sf);display:flex;align-items:center;justify-content:center}
.oc .mid .im img{max-width:85%;max-height:85%;mix-blend-mode:multiply}
.tl2{margin:14px 16px 0;position:relative}
.ts{display:flex;gap:12px;padding-bottom:18px;position:relative}
.ts::before{content:'';position:absolute;right:10px;top:22px;bottom:0;width:2px;background:var(--ln)}
.ts:last-child::before{display:none}
.ts.done::before{background:var(--g2)}
.ts .c{width:22px;height:22px;border-radius:50%;border:2px solid #C9CFCC;background:#fff;flex:none;display:flex;align-items:center;justify-content:center;z-index:1}
.ts.done .c{background:var(--g2);border-color:var(--g2);color:#fff}
.ts.cur .c{border-color:var(--co);box-shadow:0 0 0 4px rgba(240,103,87,.15)}
.ts .c svg{width:13px;height:13px}
.ts b{font-size:13.5px;display:block}
.ts small{font-size:12px;color:var(--mu)}
.otp{display:flex;gap:10px;justify-content:center;direction:ltr;margin-top:18px}
.otp span{width:56px;height:62px;border-radius:14px;border:1.5px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.otp span.f{border-color:var(--g)}
.inp{height:54px;border:1.5px solid var(--ln);border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;direction:ltr;font-size:16px}
.inp.f{border-color:var(--g)}
.inp .cc{display:flex;align-items:center;gap:6px;padding-right:10px;border-right:1px solid var(--ln);font-weight:600}
.inp input{border:0;outline:0;font:inherit;flex:1;min-width:0;background:transparent}
.auth{padding:10px 22px 0;display:flex;flex-direction:column;height:100%}
.auth h1{font-size:24px;font-weight:700;margin-top:26px}
.auth p{color:var(--mu);font-size:13.5px;margin-top:6px;line-height:1.6}
.auth .fill{flex:1}
.auth .legal{font-size:11.5px;color:var(--mu);text-align:center;margin:12px 0 26px;line-height:1.6}
.auth .legal u{color:var(--g2);text-decoration:none;font-weight:600}
.empty{text-align:center;color:var(--mu);padding:40px 20px}
.acc{margin:8px 16px 0;border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.acc .li{padding:14px;border-top:1px solid var(--ln)}
.acc .li:first-child{border-top:0}
.prof{display:flex;align-items:center;gap:12px;padding:8px 16px 4px}
.prof .av{width:54px;height:54px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.save{margin:14px 16px 0;border-radius:16px;background:linear-gradient(135deg,#0B3D33,#0B725D);color:#fff;padding:16px}
.save small{opacity:.8;font-size:12px}
.save b{display:block;font-size:26px;margin-top:2px}
.chev{width:18px;height:18px;color:#B4BBB8;flex:none}
</style>
</head>
<body>
<div class="stage">
  <aside class="side">
    <img src="img/logo.png" alt="معنا" style="height:44px">
    <h1>جرّب تطبيق معنا</h1>
    <p>نسخة تجريبية تفاعلية لتطبيق العميل: سجّل برقم جوالك، تصفح الحملات، انضم، وادفع، وتابع طلبك.</p>
    <span class="sim">محاكاة: لا دفع حقيقي ولا طلبات حقيقية</span>
  </aside>
  <div class="phone"><div class="app" id="app">
    <div class="sbar" id="sbar"><span>9:41</span><span><i></i><b></b></span></div>
    <div class="view" id="view"></div>
    <div id="dock"></div>
    <nav class="tabs" id="tabs"></nav>
  </div></div>

<script>

  <div class="share" data-share><span class="wa">${ICON.wa}</span><div class="tx"><b>شاركها في قروب العائلة</b>${n?`كل مشترك يقرّب الحملة من سعر ${n[1]} ر.س للجميع`:'ساعد جيرانك يلحقون السعر'}</div>${ICON.chev}</div>
  <div class="card" style="padding:4px 14px">
   <div class="li">${ICON.truck}<div class="tx"><b>التوصيل لباب بيتك</b><small>خلال 2–5 أيام عمل من إغلاق الحملة · 26 ر.س لأول كرتون و12 لكل إضافي</small></div></div>
   <div class="li">${ICON.refund}<div class="tx"><b>ما اكتملت الحملة؟</b><small>يرجع مبلغك كامل تلقائياً لنفس وسيلة الدفع</small></div></div>
   <div class="li">${ICON.shield}<div class="tx"><b>منتج أصلي ومختوم</b><small>نشتري مباشرة من الموزع المعتمد · فاتورة ضريبية باسمك</small></div></div></div>
  <div class="card"><h4>كيف تشتغل الحملة؟</h4>
   <div class="tl2" style="margin:12px 0 0">${[['انضم واحجز كميتك','يُحجز المبلغ ولا يُخصم إلا إذا اكتملت الحملة'],['تُغلق الحملة','بالسعر النهائي حسب عدد المشتركين'],['نطلب بالجملة ونوصّل','لباب بيتك مع رمز استلام']].map(([a,b],i)=>`<div class="ts ${i===0?'cur':''}"><span class="c"></span><div><b>${a}</b><small>${b}</small></div></div>`).join('')}</div></div>
  <div class="pad"></div>`; };
V.checkout = () => { const p=PM[st.pid], t=p.t1, q=st.q, dl=26+12*(q-1), sub=t*q, tot=sub+dl, mkt=p.mkt*q;
  const pms=[['apple','Apple Pay','ادفع بلمسة','#000','#fff',''],['mada','مدى','بطاقة مدى المحفوظة •••• 5678','#fff','#1B3B6F','border:1px solid #DDE'],['stc','STC Pay','محفظة STC Pay','#4F008C','#fff',''],['card','بطاقة ائتمانية','فيزا أو ماستركارد','#F5F6F5','#333','']];
  return `<div class="tbar"><button class="ib" data-back>${ICON.back}</button><h2>تأكيد الانضمام</h2><span style="width:38px"></span></div>
  <div class="card" style="margin-top:4px;display:flex;gap:12px;align-items:center"><div class="pci" style="width:64px;height:64px;flex:none">${img(p)}</div><div style="flex:1"><b style="font-size:13.5px">${p.ars}</b><p style="font-size:12px;color:var(--mu)">${p.arp}</p><p style="font-size:12px;color:var(--co);font-weight:600;margin-top:2px">${t} ر.س للكرتون · قد ينزل إلى ${p.t3}</p></div>
   <div class="qty" style="height:40px"><button data-q="-1">−</button><b>${q}</b><button data-q="1">+</button></div></div>
  <div class="card"><h4>عنوان التوصيل <small style="color:var(--g2)">تغيير</small></h4><p style="font-size:13px;margin-top:6px">المنزل · حي النرجس، الرياض</p><p style="font-size:12px;color:var(--mu)">العنوان الوطني: RNRA 4321 · 0559 123 4567</p></div>
  <div class="sec" style="padding-top:16px"><h3 style="font-size:15px">طريقة الدفع</h3>${pms.map(([k,l,s,b,c,x])=>`<div class="pm ${st.pm===k?'on':''}" data-pm="${k}"><span class="lg" style="background:${b};color:${c};${x}">${k==='apple'?'Apple Pay':k==='mada'?'mada':k==='stc'?'stc':ICON.card}</span><div class="tx">${l}<small>${s}</small></div><span class="rd"></span></div>`).join('')}</div>
  <div class="card"><div class="sumr"><span>المنتجات (${q} كرتون)</span><span>${fmt(sub)} ر.س</span></div><div class="sumr"><span>التوصيل (${q===1?'طرد':q===2?'طردان':q+' طرود'})</span><span>${dl} ر.س</span></div>
   <div class="sumr t"><span>يُحجز الآن</span><span>${fmt(tot)} ر.س</span></div><div class="sumr s"><span>توفيرك مقارنة بالسوق</span><span>${fmt(mkt+dl-tot>0?mkt-sub:0)} ر.س</span></div></div>
  <p class="note">${ICON.shield}<span>نحجز المبلغ فقط. لا يُخصم إلا إذا اكتملت الحملة، وإذا نزل السعر يُخصم السعر الأقل ويرجع الفرق.</span></p><div class="pad"></div>`; };
V.done = () => { const o=st.orders[0]; const p=PM[o.pid];
  return `<div style="padding:60px 24px 0;text-align:center"><div style="width:76px;height:76px;border-radius:50%;background:#E6F4EE;color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div>
  <h1 style="font-size:21px;margin-top:18px">انضممت للحملة</h1><p style="color:var(--mu);font-size:13.5px;margin-top:6px;line-height:1.7">حجزنا ${fmt(o.tot)} ر.س على ${o.pmn}.<br>نبلغك أول ما تكتمل الحملة، ولن يُخصم شيء قبلها.</p></div>
  <div class="card" style="display:flex;gap:12px;align-items:center;margin-top:24px"><div class="pci" style="width:58px;height:58px;flex:none">${img(p)}</div><div style="flex:1"><b style="font-size:13.5px">${p.ars} × ${o.q}</b><p style="font-size:12px;color:var(--mu)">طلب رقم ${o.no}</p></div><span class="stt" style="background:#FFF4D9;color:#7A5200">بانتظار الاكتمال</span></div>
  <div class="share" data-share><span class="wa">${ICON.wa}</span><div class="tx"><b>عجّل الحملة: شاركها مع أهلك</b>كل ما زاد العدد نزل السعر عليك وعليهم</div>${ICON.chev}</div>
  <div style="padding:20px 16px"><button class="btn ghost" data-go="orders">عرض طلباتي</button></div>`; };
V.orders = () => `<div class="tbar"><span style="width:38px"></span><h2>طلباتي</h2><span style="width:38px"></span></div>
  <div class="seg"><button class="on">الحالية</button><button>السابقة</button></div>
  ${st.orders.length?st.orders.map(o=>{ const p=PM[o.pid]; return `<div class="oc" data-order="${o.no}"><div class="top"><span>طلب ${o.no}</span><span class="stt" style="${o.s==='ship'?'background:#E6F4EE;color:#0B8A5F':'background:#FFF4D9;color:#7A5200'}">${o.s==='ship'?'في الطريق':'بانتظار الاكتمال'}</span></div><div class="mid"><div class="im">${img(p)}</div><div style="flex:1"><b style="font-size:13.5px">${p.ars} × ${o.q}</b><p style="font-size:12px;color:var(--mu)">${fmt(o.tot)} ر.س · ${o.pmn}</p></div>${ICON.chev}</div></div>`; }).join('')
   : `<div class="empty"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#C9CFCC" stroke-width="1.4"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><p style="margin-top:10px;font-weight:600;color:var(--ink)">ما عندك طلبات حالياً</p><p style="font-size:12.5px;margin-top:4px">انضم لحملة ووفّر على مقاضي بيتك</p><button class="btn pri sm" style="margin:14px auto 0" data-go="home">تصفح الحملات</button></div>`}
  <div class="oc" data-order="MN-10311"><div class="top"><span>طلب MN-10311</span><span class="stt" style="background:#F0F2F1;color:#4B5651">تم التسليم</span></div><div class="mid"><div class="im">${img(PM.persil)}</div><div style="flex:1"><b style="font-size:13.5px">برسيل جل 2.9 لتر × 1</b><p style="font-size:12px;color:var(--mu)">120 ر.س · مدى · 4 أكتوبر</p></div>${ICON.chev}</div></div><div class="pad"></div>`;
V.track = () => { const o = st.orders.find(x=>x.no===st.ono) || {no:'MN-10311',pid:'persil',q:1,s:'done'}; const p=PM[o.pid];
  const S=[['انضممت للحملة','تم حجز المبلغ'],['اكتملت الحملة','خُصم السعر النهائي'],['اشترينا بالجملة','من الموزع المعتمد'],['استلمتها شركة الشحن','من مستودع المورد'],['خرج للتوصيل','نرسل لك رمز الاستلام'],['تم التسليم','بالرمز وصورة الإثبات']];
  const k = o.s==='done'?6:o.s==='ship'?4:1;
  return `<div class="tbar"><button class="ib" data-back>${ICON.back}</button><h2>طلب ${o.no}</h2><span style="width:38px"></span></div>
  <div class="card" style="margin-top:4px;display:flex;gap:12px;align-items:center"><div class="pci" style="width:58px;height:58px;flex:none">${img(p)}</div><div style="flex:1"><b style="font-size:13.5px">${p.ars} × ${o.q}</b><p style="font-size:12px;color:var(--mu)">${o.s==='done'?'وصل 9 أكتوبر':'الحملة تنتهي خلال '+left(o.pid)}</p></div></div>
  <div class="card"><h4>حالة الطلب</h4><div class="tl2" style="margin:14px 0 0">${S.map(([a,b],i)=>`<div class="ts ${i<k?'done':i===k?'cur':''}"><span class="c">${i<k?ICON.check:''}</span><div><b style="${i>k?'color:#9AA29E':''}">${a}</b><small>${b}</small></div></div>`).join('')}</div></div>
  <div class="card" style="padding:4px 14px"><div class="li">${ICON.doc}<div class="tx"><b>الفاتورة الضريبية</b><small>تُصدر بعد اكتمال الحملة</small></div>${ICON.chev}</div><div class="li">${ICON.help}<div class="tx"><b>مساعدة في هذا الطلب</b><small>تالف، ناقص، أو إلغاء</small></div>${ICON.chev}</div></div><div class="pad"></div>`; };
V.account = () => `<div class="tbar"><span style="width:38px"></span><h2>حسابي</h2><span style="width:38px"></span></div>
  <div class="prof"><div class="av">ن</div><div><b style="font-size:16px">نورة القحطاني</b><p style="font-size:12.5px;color:var(--mu)" dir="ltr">+966 ${st.phone||'55 123 4567'}</p></div></div>
  <div class="save"><small>وفّرت مع معنا هذا العام</small><b>214.60 ر.س</b><small>من 7 طلبات · مقارنة بأسعار السوق</small></div>
  <div class="acc">${[['pin','العناوين','المنزل · حي النرجس'],['card','طرق الدفع','Apple Pay · مدى'],['heart','المفضلة والتنبيهات','3 منتجات'],['bell','الإشعارات',''],['help','المساعدة والدعم','واتساب 24/7'],['doc','الشروط والخصوصية','']].map(([i,a,b])=>`<div class="li" data-toast="${a}">${(ICON[i]||'').replace('<svg','<svg style="width:22px;height:22px;color:#0B725D"')}<div class="tx"><b>${a}</b>${b?`<small>${b}</small>`:''}</div>${ICON.chev}</div>`).join('')}</div>
  <div style="padding:16px"><button class="btn ghost" data-logout>تسجيل الخروج</button></div><p style="text-align:center;font-size:11px;color:#9AA29E;padding-bottom:20px">معنا · نسخة تجريبية 2.0</p>`;

function dock(){
  const d=$('#dock'); d.innerHTML='';
  if (st.route==='product'){ const p=PM[st.pid]; d.innerHTML=`<div class="dock"><div class="qty"><button data-q="-1">−</button><b>${st.q}</b><button data-q="1">+</button></div><button class="btn pri" data-go="checkout" style="flex:1">انضم للحملة · ${fmt(p.t1*st.q)} ر.س</button></div>`; }
  if (st.route==='checkout'){ const p=PM[st.pid], tot=p.t1*st.q+26+12*(st.q-1); const l={apple:'احجز بـ Apple Pay',mada:'احجز بمدى',stc:'احجز بـ STC Pay',card:'احجز بالبطاقة'}[st.pm]; d.innerHTML=`<div class="dock"><button class="btn ${st.pm==='apple'?'dark':'pri'}" id="pay" style="${st.pm==='apple'?'background:#000':''}">${l} · ${fmt(tot)} ر.س</button></div>`; }
}
let feedT=null, tickT=null;
function render(){
  $('#view').innerHTML = (V[st.route]||V.home)();
  tabs(); dock();
  clearInterval(feedT);
  if (st.route==='product'){ const F=['نورة من حي النرجس انضمت قبل دقيقتين','أبو فهد من الملقا أضاف 3 كراتين','ريم من الياسمين انضمت الآن','أسرة من جدة · الروضة انضمت قبل 5 دقائق','سارة من الخبر انضمت قبل 8 دقائق']; let i=0; feedT=setInterval(()=>{ const e=$('#feed'); if(!e) return; e.style.opacity=0; setTimeout(()=>{ i=(i+1)%F.length; e.textContent=F[i]; e.style.opacity=1; },300); },3000); }
  if (st.route==='home'){ const b=$('#bns'); if(b) b.addEventListener('scroll',()=>{ const k=Math.round(Math.abs(b.scrollLeft)/(b.clientWidth-24)); document.querySelectorAll('.dots i').forEach((d,j)=>d.classList.toggle('on',j===k)); },{passive:true}); }
  if (st.route==='login'){ const i=$('#ph'); i.addEventListener('input',()=>{ i.value=i.value.replace(/\D/g,''); st.phone=i.value; }); }
}
setInterval(()=>document.querySelectorAll('[data-left]').forEach(e=>e.textContent=left(e.dataset.left)),1000);
const hist=[];
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-pid],[data-cat],[data-q],[data-pm],[data-back],[data-toast],[data-share],[data-order],[data-logout],#sendotp,#pay,.otp');
  if (!t) return; e.stopPropagation();
  if (t.id==='sendotp'){ if (st.phone.length<9){ st.phone = st.phone || '551234567'; } go('otp',{otp:''}); let k=0; const code='4827'; setTimeout(()=>{ toast('رسالة: رمز التحقق لمعنا 4827'); const iv=setInterval(()=>{ st.otp=code.slice(0,++k); render(); if(k===4){ clearInterval(iv); setTimeout(()=>{ st.authed=true; go('home'); },500); } },260); },900); return; }
  if (t.id==='pay'){ const p=PM[st.pid], tot=p.t1*st.q+26+12*(st.q-1); const pmn={apple:'Apple Pay',mada:'مدى',stc:'STC Pay',card:'البطاقة'}[st.pm];
    const sc=document.createElement('div'); sc.className='scrim'; sc.innerHTML = st.pm==='apple' ? `<div class="sheet ap"><div class="gr"></div><div class="aph"><span>Apple Pay</span><span style="font-size:13px;color:#2563EB">Cancel</span></div><div class="row2"><span>البطاقة</span><b dir="ltr">mada •••• 5678</b></div><div class="row2"><span>التاجر</span><b>معنا</b></div><div class="tot"><span>حجز مبلغ</span><span>${fmt(tot)} ر.س</span></div><div class="side"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="1.6"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M15 8.5a3 3 0 0 0-6 0"/></svg>اضغط مرتين على الزر الجانبي للتأكيد</div></div>` : `<div class="sheet"><div class="gr"></div><p style="font-weight:700;font-size:16px;text-align:center">جاري التحقق من البنك…</p><p style="text-align:center;color:var(--mu);font-size:12.5px;margin-top:6px">رمز التحقق 3D Secure أُرسل لجوالك</p></div>`;
    $('#app').appendChild(sc);
    setTimeout(()=>{ sc.remove(); st.orders.unshift({no:'MN-'+(10480+st.orders.length+2),pid:st.pid,q:st.q,tot,pmn,s:'wait'}); st.joined[st.pid]=(st.joined[st.pid]||0)+st.q; hist.length=0; go('done'); }, 1900); return; }
  if (t.dataset.back!=null){ const r=hist.pop()||'home'; go(r); return; }
  if (t.dataset.logout!=null){ go('login'); return; }
  if (t.dataset.toast){ toast(t.dataset.toast); return; }
  if (t.dataset.share!=null){ toast('تم نسخ رابط الحملة لمشاركته في واتساب'); return; }
  if (t.dataset.q){ st.q=Math.max(1,Math.min(9,st.q+ +t.dataset.q)); render(); return; }
  if (t.dataset.pm){ st.pm=t.dataset.pm; render(); return; }
  if (t.dataset.order){ hist.push(st.route); go('track',{ono:t.dataset.order}); return; }
  if (t.dataset.cat!==undefined && !t.dataset.go){ st.cat = t.dataset.cat==='null'?null:+t.dataset.cat; render(); return; }
  if (t.dataset.cat!==undefined && t.dataset.go){ st.cat=+t.dataset.cat; go('home'); return; }
  if (t.dataset.pid){ hist.push(st.route); go('product',{pid:t.dataset.pid,q:2}); return; }
  if (t.dataset.go){ if (t.dataset.go==='checkout') hist.push(st.route); else if (!['home','cats','orders','account'].includes(t.dataset.go)) hist.push(st.route); else hist.length=0; go(t.dataset.go); }
}, true);
const qs=new URLSearchParams(location.search); if (qs.get('s')){ st.authed=true; st.phone='551234567'; go(qs.get('s'), qs.get('p')?{pid:qs.get('p')}:{}); } else render();
</script>
</body>
</html>
